<header><h1>商业无限画布</h1><small>本地工作台</small><span id="status" role="status">正在连接</span><button id="logout" hidden>退出登录</button></header>
<section id="auth" hidden><h2 id="auth-title">登录工作台</h2><p id="auth-hint">登录后打开你的本机项目。</p><form id="login-form"><label>用户名<input id="username" autocomplete="username" required pattern="[a-z][a-z0-9_-]{2,39}" placeholder="例如 designer"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="error" role="alert"></p><button class="primary" id="login-button" type="submit">登录</button></form></section>
<section id="shell" hidden><aside><strong>我的项目</strong><div id="projects"></div><form id="project-form"><label>新项目名称<input id="project-name" required maxlength="240" placeholder="产品视觉项目"></label><button class="primary" type="submit">创建项目</button></form></aside><main><div class="toolbar"><span id="current">选择或创建项目</span><button id="add" disabled>添加文字卡</button><button id="upload" disabled>添加图片</button><button id="add-tool" disabled>添加缩放工具</button><button id="add-document" disabled hidden>添加资料</button><input id="document-file" type="file" accept=".txt,.md,.csv,text/plain,text/markdown,text/csv" aria-label="选择资料文件" hidden><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="选择产品图片" hidden><button id="reset">重置视图</button></div><div class="canvas-body"><div id="viewport"><div id="empty">把产品事实与设计意图放在画布上<br>拖动卡片标题整理位置，滚轮缩放</div><div id="scene"></div></div><section id="properties" aria-label="对象属性" hidden></section></div><div class="hint">内容保存在本机。工具卡固定输入后可提交本地缩放任务；入队不代表已经执行。每图最多8MiB，每项目图片最多64MiB。</div></main></section>
<dialog id="history-dialog" aria-labelledby="history-title"><header><h2 id="history-title" style="font-size:18px;margin:0">任务与用量</h2><button id="history-close" style="margin-left:auto">关闭</button></header><div id="history-usage" role="status">读取开发用量</div><p id="history-error" role="alert"></p><div class="history-grid"><section><div class="history-actions"><button id="history-refresh">刷新列表</button><button id="history-more" hidden>更多任务</button></div><div id="history-list" aria-label="项目任务列表"></div></section><section><h3 id="history-selected">选择一项任务</h3><p id="history-state" role="status"></p><p id="history-inputs"></p><div class="history-actions"><a id="history-download" hidden>下载任务结果</a><button id="history-view" hidden>查看画布结果</button><button id="history-recover" hidden>恢复归档（不重新生成）</button><button id="history-place" hidden>放到画布</button></div><p id="history-stream"><small>选择任务后显示持久执行日志</small></p><pre id="history-events" role="log" aria-label="任务事件日志"></pre></section></div></dialog>
<dialog id="document-dialog" aria-labelledby="document-title"><header><h2 id="document-title" style="font-size:18px;margin:0">资料预览</h2><button id="document-close" style="margin-left:auto">关闭</button></header><section style="padding:20px"><p id="document-meta"></p><p id="document-error" role="alert" style="color:#b12938"></p><pre id="document-content" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto;background:#f5f6fa;border-radius:8px;padding:16px"></pre><a id="document-download" hidden>下载原件</a></section></dialog>
<script>
const $=id=>document.getElementById(id);let setup=false,project=null,revision=0,lease=null,objects=[],queue=Promise.resolve(),vx=70,vy=70,zoom=1,changeGeneration=0,cancellationEnabled=false,archiveRecoveryEnabled=false,editorModule=null,editHistory=null,pendingWrite=null,editorBusy=false,saveCount=0,controlsBlocked=false,selectionEnabled=false,selectedIds=new Set(),resultPlacementEnabled=false,placementPending=null,documentFilesEnabled=false,displayEdgesEnabled=false,displayEdges=[];const startedPlacementKeys=new Set(),recordedPlacementKeys=new Set();const acknowledged=new Map(),acknowledgedEdges=new Map();

const historyButton=document.createElement('button');historyButton.id='history-button';historyButton.textContent='任务与用量';historyButton.disabled=true;historyButton.hidden=true;$('reset').before(historyButton);
const undoButton=document.createElement('button'),redoButton=document.createElement('button'),retryButton=document.createElement('button'),exportEditsButton=document.createElement('button');

function editButtons(){const blocked=editorBusy||!!pendingWrite||!!placementPending;if(blocked||controlsBlocked){for(const id of ['add','upload','add-tool','add-document'])$(id).disabled=blocked||!project;}controlsBlocked=blocked;$('scene').inert=$('properties').inert=blocked;undoButton.hidden=redoButton.hidden=!editHistory;undoButton.disabled=!project||editorBusy||saveCount>0||timers.size>0||!!pendingWrite||!!placementPending||!editHistory?.past.length;redoButton.disabled=!project||editorBusy||saveCount>0||timers.size>0||!!pendingWrite||!!placementPending||!editHistory?.future.length;retryButton.hidden=exportEditsButton.hidden=!pendingWrite;retryButton.disabled=editorBusy;exportEditsButton.disabled=false;retryPlacementButton.hidden=!placementPending;retryPlacementButton.disabled=editorBusy;}

const historyDialog=$('history-dialog');let historyGeneration=0,historyStream=null;
const taskLabels={queued:'已入队，尚未执行',running:'正在缩放',archiving:'正在校验并归档结果',succeeded:'已完成，结果已归档',failed:'任务失败；未自动重试',unknown:'执行结果待核查；未自动重试',cancel_requested:'已请求取消，正在核查执行结果',cancelled:'已取消'};

const displayAmount=value=>String(value).replace(/(\.\d*?[1-9])0+$/,'$1').replace(/\.0+$/,'');
const displayTime=value=>new Date(value).toLocaleString('zh-CN',{hour12:false});
historyDialog.addEventListener('close',()=>{historyGeneration++;historyStream?.close();historyStream=null;});$('history-close').onclick=()=>historyDialog.close();
async function openRunHistory(onlyUnplaced=false){
  const p=project;if(!p)return;const generation=++historyGeneration;historyStream?.close();historyStream=null;let selected=null,cursor=null,selectionVersion=0,pageLoading=false;

  $('history-title').textContent=onlyUnplaced?'未归位结果':'任务与用量';$('history-error').textContent='';$('history-usage').textContent='读取开发用量';$('history-stream').textContent='选择任务后显示持久执行日志';$('history-list').replaceChildren();$('history-events').textContent='';$('history-selected').textContent='选择一项任务';$('history-state').textContent='';$('history-inputs').textContent='';$('history-download').hidden=$('history-view').hidden=$('history-recover').hidden=$('history-place').hidden=true;historyDialog.showModal();

    $('history-events').textContent='';$('history-selected').textContent=`任务 ${item.id.slice(0,8)}`;$('history-state').textContent='读取任务';$('history-download').hidden=$('history-view').hidden=$('history-recover').hidden=$('history-place').hidden=true;
    let seen=0,snapshotSequence=-1,refreshQueue=Promise.resolve(),recovering=false,placing=false;const current=()=>active()&&selected===item.id&&selectionVersion===version;

document.addEventListener('keydown',event=>{if(!selectionEnabled||editorBusy||pendingWrite||placementPending||historyDialog.open||documentDialog.open||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;const command=event.ctrlKey||event.metaKey,key=event.key.toLowerCase();if(command&&key==='a'){event.preventDefault();chooseObjects(objects.filter(o=>!o.deleted).map(o=>o.id));}else if(command&&key==='d'){event.preventDefault();selectionEdit(current=>{const values=editorModule.copiedSelection(current,new Set(current.map(o=>o.id)),()=>crypto.randomUUID());return {values:[...values,...(displayEdgesEnabled?editorModule.copiedDisplayEdges(displayEdges,current,values,()=>crypto.randomUUID()):[])],selectionIds:values.map(o=>o.id)};});}else if(command&&key==='g'){event.preventDefault();selectionEdit(current=>{if(current.some(o=>o.locked))throw Error('OBJECT_LOCKED');if(!event.shiftKey&&current.length<2)return null;const groupId=event.shiftKey?null:crypto.randomUUID();return {values:current.map(o=>({...o,groupId}))};});}else if(key==='delete'||key==='backspace'){event.preventDefault();selectionEdit(current=>{if(current.some(o=>o.locked))throw Error('OBJECT_LOCKED');return {values:current.map(o=>({...o,deleted:true}))};});}else if(key==='escape')chooseObjects([]);});

function render(){
  $('scene').replaceChildren();$('empty').hidden=objects.some(object=>!object.deleted);

      const download=document.createElement('a');download.textContent='下载原件';download.href=image.src+'?download=1';download.style.cssText='display:block;padding:3px 12px;font-size:12px';card.append(image,download);

$('reset').onclick=()=>{vx=70;vy=70;zoom=1;transform();};let pan=null;$('viewport').onpointerdown=e=>{if(e.target!==$('viewport')||e.button!==0||editorBusy||pendingWrite)return;e.preventDefault();if(e.shiftKey)window.getSelection()?.removeAllRanges();pan={x:e.clientX,y:e.clientY,vx,vy,box:selectionEnabled&&e.shiftKey,moved:false};if(pan.box){pan.element=document.createElement('div');pan.element.className='selection-box';$('viewport').append(pan.element);} $('viewport').setPointerCapture(e.pointerId);};$('viewport').onpointermove=e=>{if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;pan.moved=pan.moved||Math.hypot(dx,dy)>=4;if(pan.box){const bounds=$('viewport').getBoundingClientRect();pan.element.style.cssText=`left:${Math.min(pan.x,e.clientX)-bounds.left}px;top:${Math.min(pan.y,e.clientY)-bounds.top}px;width:${Math.abs(dx)}px;height:${Math.abs(dy)}px`;}else{vx=pan.vx+dx;vy=pan.vy+dy;transform();}};$('viewport').onpointerup=e=>{if(!pan)return;const gesture=pan;pan=null;if(gesture.box){gesture.element.remove();const bounds=$('viewport').getBoundingClientRect(),ids=editorModule.boxSelection(objects,{x:(gesture.x-bounds.left-vx)/zoom,y:(gesture.y-bounds.top-vy)/zoom,width:(e.clientX-gesture.x)/zoom,height:(e.clientY-gesture.y)/zoom});chooseObjects([...ids]);}else if(!gesture.moved&&selectionEnabled)chooseObjects([]);};$('viewport').onpointercancel=()=>{pan?.element?.remove();pan=null;};$('viewport').addEventListener('wheel',e=>{e.preventDefault();const bounds=$('viewport').getBoundingClientRect(),x=e.clientX-bounds.left,y=e.clientY-bounds.top,next=Math.max(.15,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));vx=x-(x-vx)*next/zoom;vy=y-(y-vy)*next/zoom;zoom=next;transform();},{passive:false});
